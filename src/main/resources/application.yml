server:
  port: 8080

spring:
  application:
    name: ad-video-gen-java
  datasource:
    url: jdbc:h2:file:./data/ad-video-gen;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:220MB}

ad-video:
  llm:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${ARK_API_KEY:}
    # Doubao-Seed-1.6: 理解用户输入并转化为 Agent/工具调用
    model: ${LLM_MODEL:doubao-seed-1-6-250615}
    endpoint-id: ${LLM_ENDPOINT_ID:}
  image:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${ARK_API_KEY:}
    # Doubao-Seedream 4.5 pro: 文生图 / 参考图生图
    model: ${IMAGE_MODEL:doubao-seedream-4-5-pro}
    endpoint-id: ${CGT_ENDPOINT_ID:}
  video:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${ARK_API_KEY:}
    # Doubao-Seedance 1.0 pro: 图文生视频
    model: ${VIDEO_MODEL:doubao-seedance-1-0-pro}
    endpoint-id: ${T2V_ENDPOINT_ID:}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:ad-video-gen-java}
    region: ${S3_REGION:us-east-1}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
    object-expiration-days: ${S3_OBJECT_EXPIRATION_DAYS:7}
  short-link:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  ffmpeg:
    binary: ${FFMPEG_BINARY:ffmpeg}
    output-dir: ${FFMPEG_OUTPUT_DIR:./data/final-videos}
